<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body>
    <div id="login-container" class="container glass">
        <h1>Join a Room</h1>
        <input type="text" id="username" placeholder="Your Name" autocomplete="off">
        <input type="text" id="room" placeholder="Room Name" autocomplete="off">
        <button id="join-btn" class="primary-btn">Join Chat</button>
    </div>

    <div id="chat-container" class="container glass hidden">
        <div class="chat-header">
            <h2 id="room-name-display">Room</h2>
            <button id="leave-btn" class="secondary-btn">Leave</button>
        </div>
        <div id="messages"></div>
        <div class="input-area">
            <input type="text" id="msg-input" placeholder="Type your message..." autocomplete="off">
            <button id="send-btn" class="primary-btn">Send</button>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
